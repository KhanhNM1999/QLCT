<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Lương & Tiết Kiệm</title>
  <meta name="theme-color" content="#00899a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="QLCT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest?v=26" />
  <link rel="apple-touch-icon" href="assets/app-icon-180.png?v=26" />
  <link rel="stylesheet" href="styles.css?v=26" />
</head>
<body>
  <div class="workspace">
    <aside class="notes">
      <p class="eyebrow">QLCT</p>
      <h1>Lương & Tiết Kiệm</h1>
      <p>
        App cá nhân để nhập lương, khoản cần trả và theo dõi số tiền có thể tiết kiệm.
      </p>
      <div class="note-card">
        <strong>Giới hạn iOS thật</strong>
        <span>App dùng dữ liệu bạn nhập tay hoặc paste từ tin nhắn ngân hàng.</span>
      </div>
      <div class="shortcuts">
        <button id="openImportFromSide">Import lương</button>
        <button id="loadSampleFromSide">Load sample</button>
        <button id="resetFromSide" class="ghost">Reset app trắng</button>
      </div>
    </aside>

    <main class="phone-shell" aria-label="iPhone preview">
      <div class="phone">
        <div id="app" class="screen"></div>

        <nav class="tabbar" aria-label="Main tabs">
          <button class="tab active" data-tab="dashboard">
            <span class="tab-icon"></span>
            <span>Tổng quan</span>
          </button>
          <button class="tab" data-tab="payments">
            <span class="tab-icon"></span>
            <span>Khoản trả</span>
          </button>
          <button class="tab" data-tab="checklist">
            <span class="tab-icon"></span>
            <span>Checklist</span>
          </button>
          <button class="tab" data-tab="analytics">
            <span class="tab-icon"></span>
            <span>Phân tích</span>
          </button>
          <button class="tab" data-tab="settings">
            <span class="tab-icon"></span>
            <span>Cài đặt</span>
          </button>
        </nav>
      </div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="bank-directory.js?v=26"></script>
  <script src="app.js?v=26"></script>
</body>
</html>
