name: Build iOS and upload to Appetize

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install cocoapods --no-document || true
          pod --version || true

      - name: Install pods (if Podfile exists)
        run: |
          if [ -f QLCTApp/Podfile ]; then (cd QLCTApp && pod install); fi
      - name: Install xcodegen
        run: |
          brew install xcodegen || true
          xcodegen --version || true

      - name: Generate Xcode project with XcodeGen
        working-directory: QLCTApp
        run: |
          if [ -f project.yml ]; then
            xcodegen generate || true
          else
            echo "No project.yml found, skipping xcodegen"
          fi
      - name: Import signing assets (optional)
        if: ${{ env.APPLE_CERT_BASE64 != '' && env.MOBILEPROVISION_BASE64 != '' }}
        run: |
          set -e
          echo "Decoding certificate..."
          echo "$APPLE_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          echo "Create temporary keychain"
          security create-keychain -p macos_tmp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p macos_tmp build.keychain
          security import /tmp/cert.p12 -k ~/Library/Keychains/build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple: -s -k macos_tmp ~/Library/Keychains/build.keychain || true
          echo "Decoding provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/embedded.mobileprovision

      - name: Build and archive
        working-directory: QLCTApp
        env:
          DEVELOPER_TEAM: ${{ secrets.TEAM_ID }}
        run: |
          set -e
          echo "DEVELOPER_TEAM=$DEVELOPER_TEAM"
          if [ -n "$APPLE_CERT_BASE64" ] && [ -n "$MOBILEPROVISION_BASE64" ]; then
            echo "Using imported signing assets (manual signing)"
            xcodebuild -scheme QLCTApp -configuration Release -archivePath $PWD/build/QLCTApp.xcarchive archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$DEVELOPER_TEAM -allowProvisioningUpdates
          else
            echo "No signing assets provided — using Automatic signing with allowProvisioningUpdates"
            xcodebuild -scheme QLCTApp -configuration Release -archivePath $PWD/build/QLCTApp.xcarchive archive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=$DEVELOPER_TEAM -allowProvisioningUpdates
          fi

      - name: Export IPA
        working-directory: QLCTApp
        run: |
          set -e
          echo "--- Diagnostics: show build folder ---"
          ls -la $PWD || true
          echo "--- Diagnostics: show archive folder ---"
          ls -la $PWD/build || true
          ls -la $PWD/build/QLCTApp.xcarchive || true
          echo "--- Run exportArchive (with allowProvisioningUpdates) ---"
          if [ -f $PWD/exportOptions.plist ]; then
            xcodebuild -exportArchive -archivePath $PWD/build/QLCTApp.xcarchive -exportPath $PWD/build/QLCTApp -exportOptionsPlist $PWD/exportOptions.plist -allowProvisioningUpdates || true
          else
            xcodebuild -exportArchive -archivePath $PWD/build/QLCTApp.xcarchive -exportPath $PWD/build/QLCTApp -exportOptionsPlist ./exportOptions.plist -allowProvisioningUpdates || true
          fi
          echo "--- export exit code: $? ---"

      - name: Upload to Appetize
        if: always()
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          IPA_PATH="QLCTApp/build/QLCTApp/QLCTApp.ipa"
          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to Appetize..."
            curl -F "file=@$IPA_PATH" -H "Accept: application/json" -u "$APPETIZE_API_TOKEN:": https://api.appetize.io/v1/apps
          else
            echo "IPA not found at $IPA_PATH"
            ls -R
          fi
