name: Build iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: QLCTApp
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: QLCTApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project QLCTApp.xcodeproj \
            -scheme QLCTApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: QLCTApp
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in Release-iphoneos"
            find build/DerivedData/Build/Products -maxdepth 3 -type d
            exit 1
          fi

          rm -rf build/Payload build/UnsignedIPA
          mkdir -p build/Payload build/UnsignedIPA
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -r UnsignedIPA/LuongTietKiem-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuongTietKiem-unsigned-ipa
          path: QLCTApp/build/UnsignedIPA/LuongTietKiem-unsigned.ipa
          if-no-files-found: error
